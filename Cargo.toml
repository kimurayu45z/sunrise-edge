[workspace]
members = [
    "crates/protocol-types",
    "crates/canonical-encoding",
    "crates/hashing",
    "crates/crypto",
    "crates/commitments",
    "crates/objects",
    "crates/protocol-config",
    "crates/abi",
    "crates/runtime",
    "crates/runtime-postgres",
    "crates/runtime-sqlite",
    "crates/execution",
    "crates/fees",
    "crates/bonds",
    "crates/governance",
    "crates/contract-sdk",
    "crates/chain-ir",
    "crates/system-modules",
    "crates/protocol-upgrades",
    "crates/validator-set",
    "crates/consensus",
    "crates/node-core",
    "crates/node-wire",
    "crates/native-http",
    "apps/devnet",
    "clients/rust",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
protocol-types = { path = "crates/protocol-types" }
canonical-encoding = { path = "crates/canonical-encoding" }
hashing = { path = "crates/hashing" }
crypto = { path = "crates/crypto" }
commitments = { path = "crates/commitments" }
objects = { path = "crates/objects" }
abi = { path = "crates/abi" }
protocol-config = { path = "crates/protocol-config" }
runtime = { path = "crates/runtime" }
runtime-postgres = { path = "crates/runtime-postgres" }
runtime-sqlite = { path = "crates/runtime-sqlite" }
execution = { path = "crates/execution" }
fees = { path = "crates/fees" }
bonds = { path = "crates/bonds" }
governance = { path = "crates/governance" }
contract-sdk = { path = "crates/contract-sdk" }
chain-ir = { path = "crates/chain-ir" }
system-modules = { path = "crates/system-modules" }
protocol-upgrades = { path = "crates/protocol-upgrades" }
validator-set = { path = "crates/validator-set" }
consensus = { path = "crates/consensus" }
node-core = { path = "crates/node-core" }
node-wire = { path = "crates/node-wire" }
native-http = { path = "crates/native-http" }
sunrise-edge-client = { path = "clients/rust" }
sunrise-edge-devnet = { path = "apps/devnet" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
ed25519-zebra = { version = "=4.2.0", default-features = false }
postgres = "=0.19.14"
postgres_rustls = "=0.1.6"
r2d2_postgres = "=0.18.2"
rcgen = "=0.14.10"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
sha2 = "0.11.0"
sha3 = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
wasmi = "=1.1.0"
wat = "1"
