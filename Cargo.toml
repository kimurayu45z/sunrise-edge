[workspace]
members = [
    "crates/protocol-types",
    "crates/canonical-encoding",
    "crates/hashing",
    "crates/crypto",
    "crates/commitments",
    "crates/objects",
    "crates/protocol-config",
    "crates/abi",
    "crates/runtime",
    "crates/execution",
    "crates/fees",
    "crates/bonds",
    "crates/governance",
    "crates/contract-sdk",
    "crates/chain-ir",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
protocol-types = { path = "crates/protocol-types" }
canonical-encoding = { path = "crates/canonical-encoding" }
hashing = { path = "crates/hashing" }
crypto = { path = "crates/crypto" }
commitments = { path = "crates/commitments" }
objects = { path = "crates/objects" }
abi = { path = "crates/abi" }
protocol-config = { path = "crates/protocol-config" }
runtime = { path = "crates/runtime" }
execution = { path = "crates/execution" }
fees = { path = "crates/fees" }
bonds = { path = "crates/bonds" }
governance = { path = "crates/governance" }
contract-sdk = { path = "crates/contract-sdk" }
chain-ir = { path = "crates/chain-ir" }
sha2 = "0.10.9"
sha3 = "0.10.8"
wasmi = "1.1.0"
